services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LOADER_PASSWORD: ${LOADER_PASSWORD}
      EXTRACTOR_PASSWORD: ${EXTRACTOR_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./sql/init.sql:/seed/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-api:
    build: .
    entrypoint: ["uvicorn"]
    command: ["app.mock_api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]

  airflow-init:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: local-development-only
      DATABASE_URL: postgresql://loader:${LOADER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SOURCE_DATABASE_URL: postgresql://extractor:${EXTRACTOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_BASE_URL: http://mock-api:8000
      DATA_ROOT: /opt/pipeline/data
    command: ["bash", "-c", "airflow db migrate && (airflow users create --username admin --password \"$${AIRFLOW_ADMIN_PASSWORD}\" --firstname Local --lastname Admin --role Admin --email admin@example.com || true)"]
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./app:/opt/airflow/app
      - ./data:/opt/pipeline/data
      - ./tests:/opt/airflow/tests

  airflow-webserver:
    build: .
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    environment: *airflow-env
    command: ["airflow", "webserver"]
    ports: ["${AIRFLOW_PORT:-8080}:8080"]
    volumes: *airflow-volumes
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    build: .
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    environment: *airflow-env
    command: ["airflow", "scheduler"]
    volumes: *airflow-volumes

  dashboard:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://loader:${LOADER_PASSWORD}@postgres:5432/${POSTGRES_DB}
    entrypoint: ["streamlit"]
    command: ["run", "app/dashboard.py", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]

volumes:
  pgdata:
